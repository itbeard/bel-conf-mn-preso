<!doctype html>
<html lang="be">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Мова Нанова Уроцлаў · Даклад Эміліі Гаўрус</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="progress" id="progress"></div>
  <main class="deck"><div class="stage" id="stage"></div></main>
  <div class="controls">
    <button id="prev" aria-label="Папярэдні слайд">←</button>
    <span class="counter" id="counter"></span>
    <button id="next" aria-label="Наступны слайд">→</button>
    <button id="full" aria-label="Поўны экран">⛶</button>
  </div>
  <div class="help">← → · Прабел · F — поўны экран · Esc</div>
  <input type="file" id="videoInput" accept="video/*">

  <script src="js/slides.js"></script>
  <script src="js/media.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
